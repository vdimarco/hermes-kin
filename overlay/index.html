<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- The bundled meshopt decoder needs WebAssembly; JavaScript eval stays blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; media-src 'self' file:; base-uri 'none'; form-action 'none'; object-src 'none'" />
<style>
  :root {
    --surface: #0a0b0e;
    --surface-row: #111318;
    --surface-hover: #181b22;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f3f4f6;
    --text-dim: #8b92a0;
    --text-muted: #565c68;
    --green: #10b981;
    --amber: #f59e0b;
    --blue: #3b82f6;
    --red: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #root {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  /* 3D Head Stage — Pure, uncluttered */
  #stage {
    position: relative;
    width: 100%;
    height: 238px;
    flex: 0 0 238px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  /* Unified Floating Capsule Bar under the chin */
  #bar {
    position: relative;
    z-index: 10;
    margin-top: -10px;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 5px 0 6px;
    width: 90%;
    max-width: 296px;
    border-radius: 999px;
    background: rgba(10, 11, 14, 0.96);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: border-color 0.18s;
  }

  #bar:hover {
    border-color: var(--border-strong);
  }

  #root.mic-speaking #bar {
    border-color: rgba(16, 185, 129, 0.55);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), 0 0 16px rgba(16, 185, 129, 0.2);
  }

  /* Mic Toggle Pill on the Left of the Capsule */
  #mic-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  #mic-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
  }

  #root.mic-on #mic-btn {
    background: rgba(16, 185, 129, 0.16);
    color: var(--green);
  }

  #root.mic-speaking #mic-btn {
    background: rgba(16, 185, 129, 0.28);
  }

  .eq {
    display: none;
    align-items: center;
    gap: 1.5px;
    height: 10px;
  }

  #root.mic-on .eq {
    display: inline-flex;
  }

  #root.mic-on .mic-off-svg {
    display: none;
  }

  .eq span {
    width: 2px;
    height: 3px;
    border-radius: 1px;
    background: var(--green);
    transition: height 0.05s linear;
  }

  .mic-off-svg {
    width: 11px;
    height: 11px;
  }

  /* Center Persona + Status Text */
  #bar-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
    cursor: pointer;
  }

  #persona-btn,
  #voice-provider-btn {
    border: none;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  #persona-btn:hover,
  #voice-provider-btn:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  /* Secondary pill: the voice engine sits next to the Avatar pill but reads
     one notch quieter so the persona stays the primary control. */
  #voice-provider-btn {
    color: var(--text-dim, var(--text));
    opacity: 0.85;
  }

  #voice-picker {
    position: absolute;
    top: 40px;
    left: 8px;
    z-index: 400;
    width: 272px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(10, 11, 14, 0.97);
    border: 1px solid var(--border);
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  #voice-picker .vp-title { font-size: 11.5px; font-weight: 600; color: var(--text); margin: 0 2px 7px; }
  #voice-picker .vp-engines { display: flex; gap: 4px; margin-bottom: 7px; }
  #voice-picker .vp-engine {
    flex: 1; font-size: 10.5px; color: var(--text-dim); background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 0; cursor: pointer;
  }
  #voice-picker .vp-engine.active { color: var(--text); border-color: rgba(16,185,129,0.55); background: rgba(16,185,129,0.10); }
  #voice-picker .vp-note { font-size: 10px; color: var(--text-dim); margin: 0 2px 6px; }
  #voice-picker .vp-list { max-height: 300px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #voice-picker .vp-chip {
    font-size: 10.5px; color: var(--text-dim); background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 6px; cursor: pointer;
    text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #voice-picker .vp-chip:hover { color: var(--text); border-color: var(--border-strong); }
  #voice-picker .vp-chip.active { color: var(--text); border-color: rgba(16,185,129,0.55); background: rgba(16,185,129,0.10); }
  #voice-picker .vp-hint { font-size: 9.5px; color: var(--text-dim); opacity: 0.7; margin: 7px 2px 0; }

  #status-line {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    padding: 5px 12px 6px;
    cursor: pointer;
    min-height: 24px;
    width: 90%;
    max-width: 296px;
    margin-top: 4px;
    border-radius: 10px;
    background: rgba(10, 11, 14, 0.92);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  #pill-text {
    font-size: 11px;
    font-weight: 450;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  /* Collapse / Expand Drawer Chevron */
  #drawer-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }

  #drawer-toggle:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
  }

  #drawer-toggle svg {
    width: 12px;
    height: 12px;
    stroke-width: 2.2;
    transition: transform 0.2s ease;
  }

  #root.collapsed #drawer-toggle svg {
    transform: rotate(180deg);
  }

  /* Clean Minimal Drawer Below */
  #drawer {
    margin-top: 6px;
    width: 90%;
    max-width: 296px;
    background: rgba(10, 11, 14, 0.96);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
  }

  #root.collapsed #drawer {
    display: none;
  }

  /* Header Row inside Drawer: Title + Quick Action Icons */
  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
  }

  .drawer-tabs {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .d-tab {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 0;
    transition: color 0.15s;
  }

  .d-tab:hover {
    color: var(--text-dim);
  }

  .d-tab.active {
    color: var(--text);
  }

  .d-tab span {
    margin-left: 3px;
    font-size: 9.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .quick-tools {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 22px;
    padding: 0 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-row);
    color: var(--text-dim);
    font-size: 9.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.14s;
  }

  .icon-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .icon-btn svg {
    width: 12px;
    height: 12px;
    stroke-width: 2;
  }

  /* Clean Task Rows */
  #task-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 200px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 2px 2px 0;
  }

  .section-label:not(:first-child) {
    margin-top: 4px;
  }

  #task-list::-webkit-scrollbar {
    width: 0;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--surface-row);
    cursor: pointer;
    transition: background 0.12s;
  }

  .row:hover {
    background: var(--surface-hover);
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--blue);
  }

  .dot.running {
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
  }

  .dot.done {
    background: var(--green);
  }

  .dot.failed {
    background: var(--red);
  }

  .row-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    flex: 1;
  }

  .row-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-sub {
    font-size: 9.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-meta {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .row-meta.running {
    color: var(--amber);
  }

  .row-meta.failed {
    color: var(--red);
  }

  .row-meta.done,
  .row-meta.live {
    color: var(--green);
  }

  /* Minimal Prompt Input */
  #ask-row {
    display: flex;
    align-items: center;
    background: var(--surface-row);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 4px 0 9px;
    height: 28px;
    transition: border-color 0.15s;
  }

  #ask-row:focus-within {
    border-color: var(--border-strong);
  }

  #ask-input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 11px;
    outline: none;
  }

  #ask-input::placeholder {
    color: var(--text-muted);
  }

  #ask-send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }

  #ask-send:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
  }

  #ask-send svg {
    width: 11px;
    height: 11px;
  }

  /* Character picker popover (right-click the persona pill) */
  #char-picker {
    position: absolute;
    z-index: 40;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    width: 276px;
    background: rgba(10, 11, 14, 0.97);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 8px;
    display: none;
    /* Four columns keep all 13 personas visible without scrolling. */
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.7);
    max-height: 330px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  #char-picker::-webkit-scrollbar {
    display: none;
  }

  #char-picker.open {
    display: grid;
  }

  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 2px 5px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: var(--surface-row);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.12s;
  }

  .chip:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .chip.active {
    color: var(--green);
    border-color: rgba(16, 185, 129, 0.6);
    background: rgba(16, 185, 129, 0.12);
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.28);
  }

  .chip.active .chip-face {
    filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.55));
  }

  .chip .chip-face {
    width: 40px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
  }

  .chip .chip-face svg, .chip .chip-face .chip-face-img {
    width: 100%;
    height: 100%;
  }

  .chip .chip-label {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="root">
  <!-- 3D Floating Head (Click to focus Hermes) -->
  <div id="stage" title="Click head to open Hermes · Right-click to close">
    <canvas id="gl"></canvas>
    <canvas id="flat"></canvas>
  </div>

  <!-- Single Unified Capsule Bar -->
  <div id="bar">
    <button id="mic-btn" type="button" title="Toggle Live Microphone">
      <span class="eq" id="eq">
        <span style="height:4px"></span>
        <span style="height:8px"></span>
        <span style="height:5px"></span>
      </span>
      <svg class="mic-off-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
      </svg>
    </button>

    <div id="bar-main">
      <button id="persona-btn" type="button" title="Avatar — click to choose your persona">Kin ▾</button>
      <button id="voice-provider-btn" type="button" title="Voice — click to pick a voice for this avatar, right-click to test">Bella ▾</button>
    </div>

    <button id="drawer-toggle" type="button" title="Hide / Show drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Status line: its own row under the bar, changing as things happen -->
  <div id="status-line" title="Click to show your tasks"><span id="pill-text">Listening…</span></div>

  <!-- Minimal Collapsible Drawer -->
  <div id="drawer">
    <div class="drawer-head">
      <div class="drawer-tabs">
        <button class="d-tab active" data-tab="recent">Tasks <span id="count-recent">0</span></button>
        <button class="d-tab" data-tab="feed">Activity <span id="count-feed">0</span></button>
      </div>
      <div class="quick-tools">
        <button class="icon-btn" data-act="see-desktop" title="Capture the active window, OCR it, and ask Hermes about it" aria-label="Snap screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
        <button class="icon-btn" data-act="read-terminal" title="Read the active terminal and ask Hermes to diagnose errors" aria-label="Inspect terminal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
        </button>
        <button class="icon-btn" data-act="voice-recap" title="Speak a status recap aloud" aria-label="Speak recap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>
    </div>

    <div id="task-list"></div>

    <div id="char-picker"></div>

    <form id="ask-row">
      <input id="ask-input" type="text" placeholder="Ask anything…" autocomplete="off" />
      <button type="submit" id="ask-send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>
</div>

<script type="module" src="./renderer.js"></script>
</body>
</html>
