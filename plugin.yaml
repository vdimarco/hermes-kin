name: kin
version: 0.4.1
description: Gives Hermes Desktop a face. A character that reacts to your work and shows what Hermes is doing.
author: Kin
license: MIT
manifest_version: 2
requires_hermes: ">=0.22.0"
provides_hooks:
  - post_tool_call
  - api_request_error
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
config_schema:
  mute:
    type: bool
    default: false
    label: Mute
    description: Silence unprompted lines and notes.
  sleep:
    type: bool
    default: false
    label: Sleep
    description: Keep Kin dozing until you wake it.
  quiet_start:
    type: str
    default: ""
    label: Quiet hours start
    description: Local time HH:MM. Empty disables quiet hours.
  quiet_end:
    type: str
    default: ""
    label: Quiet hours end
    description: Local time HH:MM. A window that passes midnight is fine.
